services:

  # ==========================================================
  # PostgreSQL
  # Guarda los metadatos de MLflow:
  # experimentos, runs, parámetros, métricas, modelos, etc.
  # ==========================================================
  postgres:
    image: postgres:14.19-trixie
    container_name: postgres
    restart: unless-stopped

    ports:
      - "${PG_PORT:-5432}:5432"

    environment:
      POSTGRES_USER: "${PG_USER:-postgres}"
      POSTGRES_PASSWORD: "${PG_PASSWORD:-postgres}"
      POSTGRES_DB: "${PG_DATABASE:-mlflow_db}"

    volumes:
      - db_data:/var/lib/postgresql/data

    networks:
      - backend

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DATABASE:-mlflow_db}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ==========================================================
  # MinIO
  # Almacena los artefactos:
  # modelos, imágenes, gráficos, JSON, etc.
  # ==========================================================
  s3:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped

    ports:
      # API compatible con S3.
      - "${MINIO_PORT:-9000}:9000"

      # Interfaz web de MinIO.
      - "${MINIO_PORT_UI:-9001}:9001"

    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minio}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_ACCESS_KEY:-minio123}"

    command: server /data --console-address ":9001"

    volumes:
      - minio_data:/data

    networks:
      - backend

    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ==========================================================
  # Creación automática del bucket de MLflow
  # ==========================================================
  create_s3_buckets:
    image: minio/mc:latest
    container_name: minio_create_bucket

    depends_on:
      s3:
        condition: service_healthy

    networks:
      - backend

    entrypoint: >
      /bin/sh -c " mc alias set local http://s3:9000 ${MINIO_ACCESS_KEY:-minio} ${MINIO_SECRET_ACCESS_KEY:-minio123};

      mc mb --ignore-existing local/${MLFLOW_BUCKET_NAME:-mlflow};

      echo 'Bucket MLflow listo';

      exit 0; "

  # ==========================================================
  # MLflow Tracking Server
  #
  # PostgreSQL -> metadatos
  # MinIO      -> artefactos
  #
  # IMPORTANTE:
  # MLflow funciona como proxy de los artefactos.
  # El Python ejecutado en el host NO necesita las credenciales
  # de MinIO.
  # ==========================================================
  mlflow:
    build:
      context: ./dockerfiles/mlflow

    image: tp-mlflow
    container_name: mlflow
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

      s3:
        condition: service_healthy

      create_s3_buckets:
        condition: service_completed_successfully

    ports:
      - "${MLFLOW_PORT:-5000}:5000"

    environment:

      # --------------------------------------------------------
      # Credenciales usadas únicamente por MLflow Server
      # para comunicarse con MinIO.
      # --------------------------------------------------------
      AWS_ACCESS_KEY_ID: "${MINIO_ACCESS_KEY:-minio}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_SECRET_ACCESS_KEY:-minio123}"

      # Nombre interno del servicio Docker.
      MLFLOW_S3_ENDPOINT_URL: "http://s3:9000"

      # Necesario para algunos clientes S3 compatibles.
      AWS_DEFAULT_REGION: "us-east-1"

      # Permite conexiones desde Airflow usando http://mlflow:5000 y desde tu Mac.
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow:5000,localhost:5000,127.0.0.1:5000"

    command: >
      mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql://${PG_USER:-postgres}:${PG_PASSWORD:-postgres}@postgres:5432/${PG_DATABASE:-mlflow_db} --artifacts-destination s3://${MLFLOW_BUCKET_NAME:-mlflow} --serve-artifacts

    networks:
      - backend

    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ==========================================================
  # Apache Airflow
  # Orquesta el entrenamiento del modelo.
  # ==========================================================
  airflow:
    build:
      context: ..
      dockerfile: airflow/Dockerfile

    image: airline-airflow
    container_name: airline-airflow

    restart: unless-stopped

    depends_on:
      mlflow:
        condition: service_healthy

    command: standalone

    ports:
      - "8080:8080"

    networks:
      - backend

    environment:
      # No cargar los DAG de ejemplo.
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      # Usuario administrador para entorno local.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"

      # Comunicación entre Airflow y MLflow.
      # IMPORTANTE: dentro de Docker NO usamos localhost.
      MLFLOW_TRACKING_URI: "http://mlflow:5000"

      MLFLOW_EXPERIMENT_NAME: "${MLFLOW_EXPERIMENT_NAME:-airline-satisfaction-v2}"

      MLFLOW_MODEL_NAME: "${MLFLOW_MODEL_NAME:-airline-satisfaction-best-random-forest}"

      # Valor predeterminado de prueba.
      OPTUNA_TRIALS: "${OPTUNA_TRIALS:-1}"

      # Para que Python encuentre src.
      PYTHONPATH: "/opt/airflow/project"

    volumes:
      # Airflow lee los DAG de esta carpeta.
      - ../dags:/opt/airflow/dags

      # Código Python del proyecto.
      - ../src:/opt/airflow/project/src

      # Dataset.
      - ../datasets:/opt/airflow/project/datasets

      # Persistencia de logs.
      - airflow_logs:/opt/airflow/logs

  # ==========================================================
  # FastAPI
  # Servicio de inferencia utilizando el modelo champion.
  # ==========================================================
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile

    image: airline-api

    container_name: airline-api

    restart: unless-stopped

    depends_on:
      mlflow:
        condition: service_healthy

    ports:
      - "8000:8000"

    networks:
      - backend

    environment:
      MLFLOW_TRACKING_URI: "http://mlflow:5000"

      MLFLOW_MODEL_NAME: "${MLFLOW_MODEL_NAME:-airline-satisfaction-best-random-forest}"

      MLFLOW_MODEL_ALIAS: "champion"

      PROJECT_ROOT: "/app/project"

      TRAIN_PATH: "/app/project/datasets/aerolineas/train.csv"

    volumes:
      - ../datasets:/app/project/datasets:ro

# ============================================================
# Red interna
# ============================================================
networks:
  backend:
    driver: bridge

# ============================================================
# Datos persistentes
# ============================================================
volumes:
  db_data:
  minio_data:
  airflow_logs:
